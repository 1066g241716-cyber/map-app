<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: content: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
    <script src="components/loader.js"></script>
    <link rel="stylesheet" href="components/loader.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js" defer></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>ToDo Master</h1>

        <!-- 進捗状況バー -->
        <div class="progress-container">
            <div class="progress-labels">
                <span>進捗率</span>
                <span id="progressText">0% (0/0)</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <!-- 入力フォーム -->
        <div class="card form-card">
            <input type="text" id="name" placeholder="新しいタスクを入力..." autofocus>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="dueDate">期限:</label>
                    <input type="date" id="dueDate">
                </div>
                <div class="form-group">
                    <label for="priority">優先度:</label>
                    <select id="priority">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">カテゴリ:</label>
                    <select id="category">
                        <option value="プライベート">プライベート</option>
                        <option value="仕事">仕事</option>
                        <option value="買い物">買い物</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
            </div>

            <button class="btn-primary" onclick="addToDo()">＋ タスクを追加</button>
        </div>

        <!-- フィルター・コントロール -->
        <div class="controls-card">
            <div class="filter-buttons">
                <button class="filter-btn active" onclick="setFilter('all', this)">すべて</button>
                <button class="filter-btn" onclick="setFilter('active', this)">未完了</button>
                <button class="filter-btn" onclick="setFilter('completed', this)">完了済み</button>
            </div>
            
            <button class="btn-danger-outline" onclick="clearCompleted()">完了済みを削除</button>
        </div>

        <!-- タスク一覧 -->
        <ul id="ToDoList" class="todo-list">
            <!-- JavaScriptでここに動的生成されます -->
        </ul>
    </div>
</body>
</html>
